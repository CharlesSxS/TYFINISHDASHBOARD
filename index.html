  #yama-ops{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    padding:16px;border-radius:14px;box-sizing:border-box;transition:background .3s,color .3s;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:34px 34px;}
  #yama-ops{--numfont:'Upper Clock','IBM Plex Mono',monospace;}
  #yama-ops.dark{--bg:#0A0E13;--barbg:linear-gradient(180deg,#0F1722,#0B111A);--panel:#111823;--panel2:#0D131C;
    --line:#1E2A38;--line2:#2A3A4D;--track:#0B111A;--ink:#E6EDF3;--muted:#7D8CA0;
    --grid:rgba(53,208,214,.04);--guide:rgba(53,208,214,.14);}
  #yama-ops.light{--bg:#EEF1F4;--barbg:linear-gradient(180deg,#FFFFFF,#F3F6F9);--panel:#FFFFFF;--panel2:#FBFCFD;
    --line:#E2E7EC;--line2:#D2DAE1;--track:#EAEEF2;--ink:#141A21;--muted:#5C6875;
    --grid:rgba(30,60,80,.05);--guide:rgba(30,90,110,.16);}
  #yama-ops *{box-sizing:border-box;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .oc-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:10px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--barbg);}
  .oc-brand{display:flex;align-items:center;gap:12px;}
  .oc-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;letter-spacing:.05em;text-transform:uppercase;line-height:1;}
  .oc-logowrap{display:inline-flex;align-items:center;}
  .oc-logo{height:34px;display:block;}
  .oc-logo-light{display:none;}
  #yama-ops.light .oc-logo-dark{display:none;}
  #yama-ops.light .oc-logo-light{display:block;}
  .oc-tag{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;}
  .oc-tag .sim{margin-left:8px;padding:2px 8px;border:1px solid #8a6d00;color:#C79A2E;border-radius:20px;font-size:10px;display:none;}
  .oc-ctrls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .oc-live{display:flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--cy,${CY});border-radius:20px;
    color:${CY};font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  .oc-live b{width:8px;height:8px;border-radius:50%;background:${CY};animation:oc-blink 1.6s infinite;}
  @keyframes oc-blink{0%,100%{opacity:1}50%{opacity:.25}}
  .oc-clock{text-align:right;}
  .oc-clock .k{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase;}
  #yama-ops .oc-clock .v{font-family:var(--numfont);font-weight:600;font-size:23px;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;display:inline-block;min-width:8.4ch;text-align:right;}
  .oc-toggle{display:flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;cursor:pointer;}
  .oc-toggle button{border:0;background:transparent;color:var(--muted);font-family:'IBM Plex Mono',monospace;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;cursor:pointer;}
  .oc-toggle button.on{background:${CY};color:#03272a;font-weight:600;}

  .oc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
  .oc-kpi{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;position:relative;overflow:hidden;}
  .oc-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--muted);}
  .oc-kpi.k-in::before{background:${CY};}.oc-kpi.k-course::before{background:${COURSE};}
  .oc-kpi.k-done::before{background:${DONE};}.oc-kpi.k-ret::before{background:${RET};}
  .oc-kpi .lab{color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  #yama-ops .oc-kpi .num{font-family:var(--numfont);font-weight:600;font-size:40px;line-height:1.05;margin-top:2px;}
  .oc-kpi.k-course .num{color:${COURSE};}.oc-kpi.k-done .num{color:${DONE};}.oc-kpi.k-ret .num{color:${RET};}

  .oc-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .oc-filter .vw{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-right:2px;}
  .oc-fbtn{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:20px;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:5px 14px;transition:all .2s;}
  .oc-fbtn:hover{color:var(--ink);border-color:var(--muted);}
  .oc-fbtn.on{color:#fff;border-color:transparent;}

  .oc-segs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
  @media(max-width:860px){.oc-segs{grid-template-columns:1fr;}.oc-kpis{grid-template-columns:repeat(2,1fr);}.oc-ctrls{gap:10px;}}
  .oc-seg{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:14px;transition:opacity .25s;}
  .oc-seg.dim{opacity:.32;}
  .oc-seghead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
  .oc-seglabel{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;}
  .oc-segsub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}

  /* circular radar gauge */
  .oc-gauge{position:relative;width:172px;height:172px;margin:6px auto 12px;}
  .oc-gauge svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .oc-track{fill:none;stroke:var(--track);stroke-width:7;}
  .oc-arc{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .7s ease;}
  .oc-guides{position:absolute;inset:14px;border-radius:50%;pointer-events:none;}
  .oc-guides::before,.oc-guides::after{content:"";position:absolute;border-radius:50%;border:1px solid var(--guide);}
  .oc-guides::before{inset:16%;}.oc-guides::after{inset:36%;}
  .oc-cross{position:absolute;inset:14px;pointer-events:none;}
  .oc-cross::before,.oc-cross::after{content:"";position:absolute;background:var(--guide);}
  .oc-cross::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px);}
  .oc-cross::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px);}
  .oc-radar{position:absolute;inset:14px;border-radius:50%;overflow:hidden;pointer-events:none;}
  .oc-sweep{position:absolute;inset:0;border-radius:50%;animation:oc-spin 3.6s linear infinite;}
  @keyframes oc-spin{to{transform:rotate(360deg)}}
  .oc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #yama-ops .oc-cnum{font-family:var(--numfont);font-weight:600;font-size:38px;line-height:1;}
  .oc-csub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:3px;}
  .oc-cpct{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;margin-top:2px;}

  .oc-segrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .oc-stat{text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--track);}
  #yama-ops .oc-stat .n{font-family:var(--numfont);font-weight:600;font-size:25px;line-height:1;}
  .oc-stat .l{color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px;}
  .oc-stat.done .n{color:${DONE};}.oc-stat.ret .n{color:${RET};}.oc-stat.course .n{color:${COURSE};}

  /* CONGRATULATIONS — rotating podium, one per course */
  .oc-cong{margin-top:13px;border:1px solid var(--line2);border-radius:9px;
    background:var(--track);padding:9px 11px 11px;overflow:hidden;}
  .oc-congh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .oc-congt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);}
  .oc-dots{display:flex;gap:4px;}
  .oc-dot{width:5px;height:5px;border-radius:50%;background:var(--line2);transition:background .3s;}
  .oc-dot.on{background:var(--ink);}
  .oc-cg{display:flex;gap:12px;align-items:center;animation:oc-roll .55s cubic-bezier(.22,1,.36,1);}
  @keyframes oc-roll{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .oc-cgrank{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;color:#0A0E13;}
  .oc-cgbody{min-width:0;flex:1;}
  .oc-cgplace{font-family:'IBM Plex Mono','Noto Sans JP',monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);line-height:1;}
  .oc-cgteam{font-family:'Barlow Condensed','Noto Sans JP',sans-serif;font-weight:700;font-size:23px;
    line-height:1.18;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #yama-ops .oc-cgtime{font-family:var(--numfont);font-weight:600;font-size:21px;flex:none;
    line-height:1;letter-spacing:.01em;white-space:nowrap;}
  .oc-cgempty{color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:10px 0;text-align:center;}

  /* top-10 leaderboard (one per course, under its radar) */
  .oc-top{margin-top:13px;border-top:1px solid var(--line);padding-top:9px;}
  .oc-toph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--muted);}
  .oc-topn{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0;}
  .oc-tr{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;
    padding:3px 0;font-size:12px;}
  .oc-tr.is-new{animation:oc-tin .4s ease;}
  @keyframes oc-tin{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
  .oc-trk{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
    color:var(--muted);text-align:center;}
  .oc-tr.pod .oc-trk{color:#0A0E13;border-radius:50%;line-height:17px;height:17px;font-size:11px;}
  .oc-tnm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .oc-ttm{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;}
  .oc-tempty{color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;padding:8px 0;text-align:center;}

  .oc-feedwrap{margin-top:10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);overflow:hidden;}
  .oc-feedhead{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);}
  .oc-feedtitle{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;}
  .oc-feedtitle span{color:${CY};}
  .oc-feednote{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);}
  .oc-feed{height:220px;overflow-y:auto;scroll-behavior:smooth;padding:4px 0;}
  .oc-feed::-webkit-scrollbar{width:8px;}.oc-feed::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;}
  .oc-fr{display:grid;grid-template-columns:64px minmax(0,1fr) 140px 92px 74px;align-items:center;gap:10px;
    padding:8px 14px;border-top:1px solid var(--line);font-size:13px;animation:oc-slide .45s ease;}
  @keyframes oc-slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .oc-fr.flash{background:linear-gradient(90deg,${CY}22,transparent);}
  .oc-rank{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;color:var(--muted);}
  .oc-rank b{color:var(--ink);}
  .oc-fteam{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .oc-chip{justify-self:start;font-family:'IBM Plex Mono','Noto Sans JP',monospace;font-size:10px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:20px;border:1px solid;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .oc-ftime{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;}
  .oc-fago{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right;}
  .oc-fr.isret .oc-ftime{color:${RET};}
  @media (prefers-reduced-motion:reduce){.oc-fr,.oc-live b,.oc-sweep{animation:none!important;}.oc-feed{scroll-behavior:auto;}}
  `;

          localJst:"\u73FE\u5730\u6642\u523B (JST)", sIn:"\u53C2\u52A0", sCourse:"\u30B3\u30FC\u30B9",
          sDone:"\u5B8C\u8D70", sRet:"\u30EA\u30BF\u30A4\u30A2",
          congrats:"\u304A\u3081\u3067\u3068\u3046\u3054\u3056\u3044\u307E\u3059", top10:"\u30C8\u30C3\u30D710",
          awaiting:"\u5B8C\u8D70\u30C1\u30FC\u30E0\u3092\u5F85\u6A5F\u4E2D", of:"/",
          feedTitle:"\u30B4\u30FC\u30EB", feedTitle2:"\u901F\u5831", logged:"\u4EF6",
          standby:"\u5F85\u6A5F\u4E2D\u2026", now:"\u305F\u3063\u305F\u4ECA",
          ago:(n,u)=>n+(u==="s"?"\u79D2":"\u5206")+"\u524D",
          sysLive:"\u30B7\u30B9\u30C6\u30E0\u7A3C\u50CD\u4E2D", preStart:"\u30B9\u30BF\u30FC\u30C8\u524D",
          recon:"\u518D\u63A5\u7D9A\u4E2D\u2026", place1:"1\u4F4D", place2:"2\u4F4D", place3:"3\u4F4D",
          dnf:"\u30EA\u30BF\u30A4\u30A2", simTag:"\u30B7\u30DF\u30E5\u30EC\u30FC\u30B7\u30E7\u30F3",
          replayTag:"2025 \u30EA\u30D7\u30EC\u30A4", replaying:"2025\u5E74\u3092\u30EA\u30D7\u30EC\u30A4\u4E2D",
          replayDone:"\u30EA\u30D7\u30EC\u30A4\u5B8C\u4E86", simulation:"\u30B7\u30DF\u30E5\u30EC\u30FC\u30B7\u30E7\u30F3",
          allIn:"\u5168\u30C1\u30FC\u30E0\u5B8C\u8D70", tag:"\u30C1\u30E3\u30EC\u30F3\u30B8 \u30C0\u30C3\u30B7\u30E5\u30DC\u30FC\u30C9" }
  };
  let LANG = "en";
  const t = k => { const v = I18N[LANG][k]; return v === undefined ? k : v; };
  const legLabel = k => LANG === "ja" ? (CONFIG.LEGS[k].labelJa || CONFIG.LEGS[k].label) : CONFIG.LEGS[k].label;
  const legSub   = k => LANG === "ja" ? (CONFIG.LEGS[k].subJa   || CONFIG.LEGS[k].sub)   : CONFIG.LEGS[k].sub;

  function applyLang() {
    ROOT.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    ROOT.querySelectorAll("#oc-lang button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
    // course names everywhere they appear
    for (const key of ORDER) {
      const sl = ROOT.querySelector("#sl-" + key); if (sl) sl.textContent = legLabel(key);
      const ss = ROOT.querySelector("#ss-" + key); if (ss) ss.textContent = legSub(key);
    }
    ROOT.querySelectorAll("#oc-filter .oc-fbtn").forEach(b => {
      b.textContent = b.dataset.f === "all" ? t("all") : legLabel(b.dataset.f);
    });
    feedEl.querySelectorAll(".oc-chip").forEach(c => { c.textContent = legLabel(c.dataset.leg); });
    feedEl.querySelectorAll(".oc-fr.isret .oc-ftime").forEach(c => { c.textContent = t("dnf"); });
    const ft = ROOT.querySelector("#oc-feedtitle");
    if (ft) ft.innerHTML = t("feedTitle") + ' <span>' + t("feedTitle2") + '</span>';
    ROOT.querySelector("#oc-feednote").textContent = feedCount ? feedCount + " " + t("logged") : t("standby");
    for (const key of ORDER) { topSig[key] = null; congSig[key] = null; renderTop(key); }
    renderCongrats();
    paint(); tickAgo();
  }
  ROOT.querySelectorAll("#oc-lang button").forEach(b => {
    b.onclick = () => { LANG = b.dataset.l; applyLang(); };
  });

  /* ---------------- CONGRATULATIONS (rotates every 5s) ---------------- */
  let congIdx = 0;
  const congSig = {};
  function renderCongrats() {
    for (const key of ORDER) {
      const stage = ROOT.querySelector("#c-" + key + "-stage");
      const dots  = ROOT.querySelector("#c-" + key + "-dots");
      const hdr   = ROOT.querySelector("#c-" + key + "-h");
      if (!stage) continue;
      if (hdr) hdr.textContent = t("congrats");
      const top = legState[key].top;
      if (!top.length) {
        const esig = LANG + "|empty";
        if (congSig[key] !== esig) {
          congSig[key] = esig;
          stage.innerHTML = '<div class="oc-cgempty">' + t("awaiting") + '</div>';
          if (dots) dots.innerHTML = "";
        }
        continue;
      }
      const n = Math.min(3, top.length);
      const i = congIdx % n;
      const r = top[i], color = CONFIG.LEGS[key].color;
      // Only rebuild when the CARD ON SCREEN actually changes. Without this the
      // roll animation re-fired on every finisher and the panel visibly bounced.
      const sig = LANG + "|" + n + "|" + i + "|" + r.team + "|" + r.time;
      if (congSig[key] === sig) continue;
      congSig[key] = sig;
      stage.innerHTML =
        '<div class="oc-cg">' +
          '<div class="oc-cgrank" style="background:' + PODIUM[i + 1] + '">' + (i + 1) + '</div>' +
          '<div class="oc-cgbody">' +
            '<div class="oc-cgplace">' + t("place" + (i + 1)) + '</div>' +
            '<div class="oc-cgteam" title="' + esc(r.team) + '">' + esc(r.team) + '</div>' +
          '</div>' +
          '<div class="oc-cgtime" style="color:' + color + '">' + esc(r.time) + '</div>' +
        '</div>';
      if (dots) dots.innerHTML = Array.from({ length: n }, (_, k) =>
        '<span class="oc-dot' + (k === i ? " on" : "") + '"></span>').join("");
    }
  }
  setInterval(() => { congIdx++; renderCongrats(); }, 5000);

  const PODIUM = { 1: "#FFD24A", 2: "#D6DBE0", 3: "#E7A977" };
  const topSig = {}, topSeen = {};

  /* Keep the fastest 10 finishers for a course and repaint its board. */
  function pushTop(key, row) {
    const t = legState[key].top;
    t.push(row);
    t.sort((a, b) => toSec(a.time) - toSec(b.time));
    if (t.length > 10) t.length = 10;
    renderTop(key);
    renderCongrats();
  }

  function renderTop(key) {
    const rows = legState[key].top;
    const box = ROOT.querySelector("#t-" + key + "-rows");
    const cnt = ROOT.querySelector("#t-" + key + "-n");
    if (!box) return;
    const h = ROOT.querySelector("#t-" + key + "-h");
    if (h) h.textContent = t("top10") + " · " + legLabel(key);
    cnt.textContent = rows.length ? rows.length + " " + t("of") + " " + legState[key].done : "—";
    // Skip the rebuild when the list is identical — otherwise every finisher
    // re-rendered all 10 rows and the board visibly bounced.
    const sig = rows.map(r => r.team + "|" + r.time).join("~");
    if (topSig[key] === sig) return;
    const prev = topSeen[key] || new Set();
    if (!rows.length) { box.innerHTML = `<div class="oc-tempty">${t("awaiting")}</div>`; return; }
    const color = CONFIG.LEGS[key].color;
    box.innerHTML = rows.map((r, i) => {
      const rank = i + 1, pod = PODIUM[rank];
      const isNew = !prev.has(r.team) ? " is-new" : "";
      return `<div class="oc-tr${pod ? " pod" : ""}${isNew}">
        <div class="oc-trk"${pod ? ` style="background:${pod}"` : ""}>${rank}</div>
        <div class="oc-tnm" title="${esc(r.team)}">${esc(r.team)}</div>
        <div class="oc-ttm" style="color:${rank <= 3 ? color : "var(--ink)"}">${esc(r.time)}</div>
      </div>`;
    }).join("");
    topSig[key] = sig;
    topSeen[key] = new Set(rows.map(r => r.team));
  }

  // Absolute instant (epoch ms) of a wave time "H:MM"/"HH:MM" on race day (JST).
  function waveMs(t) {
    const m = String(t == null ? "" : t).match(/(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const datePart = (CONFIG.RACE_START || "2026-10-17T08:00:00+09:00").slice(0, 10);
    const d = new Date(datePart + "T" + String(m[1]).padStart(2, "0") + ":" + m[2] + ":00+09:00");
    return isNaN(d.getTime()) ? null : d.getTime();
  }
  // Teams released onto the course so far = sum of waves whose time has passed.
  // No wave schedule loaded yet -> fall back to the whole roster at RACE_START.
  function releasedCount(key) {
    const s = legState[key];
    if (Array.isArray(s.waves) && s.waves.length) {
      const now = Date.now();
      let sum = 0;
      for (const w of s.waves) if (w.ms != null && now >= w.ms) sum += w.n;
      return s.entered ? Math.min(s.entered, sum) : sum;
    }
    return (raceStart != null && Date.now() >= raceStart) ? s.entered : 0;
  }

  function paint() {
    let tin = 0, tdone = 0, tret = 0, tcourse = 0;
    for (const key of ORDER) {
      const s = legState[key];
      const course = Math.max(0, releasedCount(key) - s.done - s.ret);
      tin += s.entered; tdone += s.done; tret += s.ret; tcourse += course;
      set("s-" + key + "-in", s.entered);
      set("s-" + key + "-course", course);
      set("s-" + key + "-done", s.done);
      set("s-" + key + "-ret", s.ret);
      const pct = s.entered ? Math.min(1, s.done / s.entered) : 0;
      const arc = ROOT.querySelector("#arc-" + key);
      if (arc) arc.style.strokeDashoffset = (C * (1 - pct)).toFixed(1);
      set("cnum-" + key, s.done);
      set("cpct-" + key, Math.round(pct * 100) + "%");
    }
    // KPI reflects the active view
    if (activeFilter === "all") {
      set("lab-in", t("teamsIn")); set("k-in", tin); set("k-course", tcourse); set("k-done", tdone); set("k-ret", tret);
    } else {
      const s = legState[activeFilter];
      set("lab-in", legLabel(activeFilter) + " " + t("sIn"));
      set("k-in", s.entered); set("k-course", Math.max(0, releasedCount(activeFilter) - s.done - s.ret)); set("k-done", s.done); set("k-ret", s.ret);
    }
  }

  function setFilter(f) {
    activeFilter = f;
    filterEl.querySelectorAll(".oc-fbtn").forEach(btn => {
      const on = btn.dataset.f === f;
      btn.classList.toggle("on", on);
      btn.style.cssText = on ? `background:${btn.dataset.color};color:#08211f;` : "";
    });
    segsEl.querySelectorAll(".oc-seg").forEach(seg => seg.classList.toggle("dim", f !== "all" && seg.dataset.seg !== f));
    feedEl.querySelectorAll(".oc-fr").forEach(row => { row.style.display = (f === "all" || row.dataset.leg === f) ? "" : "none"; });
    paint();
  }

  function addFeed(row, silent) {
    feedCount++;
    const L = CONFIG.LEGS[row.legKey] || { label: row.legKey, color: "#888" };
    const div = document.createElement("div");
    div.className = "oc-fr" + (silent ? "" : " flash") + (row.retired ? " isret" : "");
    div.dataset.leg = row.legKey; div.dataset.ts = row.ts;
    if (activeFilter !== "all" && activeFilter !== row.legKey) div.style.display = "none";
    div.innerHTML = `
      <div class="oc-rank">${row.retired ? "—" : "<b>#" + row.place + "</b>"}</div>
      <div class="oc-fteam" title="${esc(row.team)}">${esc(row.team)}</div>
      <div class="oc-chip" data-leg="${row.legKey}" style="color:${L.color};border-color:${L.color}55;background:${L.color}14">${esc(legLabel(row.legKey))}</div>
      <div class="oc-ftime">${row.retired ? t("dnf") : esc(row.time)}</div>
      <div class="oc-fago" data-ts="${row.ts}">now</div>`;

    if (CONFIG.FEED_DIRECTION === "up") feedEl.appendChild(div);
    else feedEl.insertBefore(div, feedEl.firstChild);
    while (feedEl.children.length > CONFIG.FEED_MAX)
      (CONFIG.FEED_DIRECTION === "up" ? feedEl.firstChild : feedEl.lastChild).remove();
    if (!silent && CONFIG.FEED_DIRECTION === "up") feedEl.scrollTop = feedEl.scrollHeight;
    if (!silent) setTimeout(() => div.classList.remove("flash"), 1400);
    ROOT.querySelector("#oc-feednote").textContent = feedCount + " " + t("logged");
  }

  function tickAgo() {
    const now = Date.now();
    feedEl.querySelectorAll(".oc-fago").forEach(el => {
      const d = Math.max(0, Math.round((now - Number(el.dataset.ts)) / 1000));
      el.textContent = d < 5 ? t("now") : d < 60 ? t("ago")(d, "s") : t("ago")(Math.floor(d / 60), "m");
    });
  }

  function set(id, v) { const el = ROOT.querySelector("#" + id); if (el) el.textContent = v; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtHMS(sec) { sec = Math.max(0, Math.floor(sec)); return pad(Math.floor(sec / 3600)) + ":" + pad(Math.floor(sec / 60) % 60) + ":" + pad(sec % 60); }

  /* ---------------- theme toggle ---------------- */
  ROOT.querySelector("#oc-theme").querySelectorAll("button").forEach(btn => {
    if (btn.dataset.t === (CONFIG.START_THEME === "light" ? "light" : "dark")) btn.classList.add("on");
    btn.onclick = () => {
      const t = btn.dataset.t;
      ROOT.classList.remove("dark", "light"); ROOT.classList.add(t);
      ROOT.querySelectorAll("#oc-theme button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    };
  });

  /* ---------------- clocks (API-driven) ---------------- */
  let raceStart = CONFIG.RACE_START ? new Date(CONFIG.RACE_START).getTime() : null;
  setInterval(() => {
    if (raceStart == null || Date.now() < raceStart) set("oc-race", "00:00:00");
    else set("oc-race", fmtHMS((Date.now() - raceStart) / 1000));
    const jst = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
    set("oc-local", pad(jst.getHours()) + ":" + pad(jst.getMinutes()) + ":" + pad(jst.getSeconds()));
    tickAgo();
  }, 1000);

  paint();
  applyLang();

  function toSec(t){ const p=String(t).split(":").map(Number); return p.reduce((a,v)=>a*60+v,0); }


  /* ---------------- LIVE polling ---------------- */
  async function poll() {
    try {
      const [rRes, rCnt, rWav] = await Promise.all([
        CONFIG.RESULTS_URL ? fetch(CONFIG.RESULTS_URL, { cache: "no-store" }).then(r => r.json()) : null,
        CONFIG.COUNTS_URL ? fetch(CONFIG.COUNTS_URL, { cache: "no-store" }).then(r => r.json()) : null,
        CONFIG.WAVES_URL  ? fetch(CONFIG.WAVES_URL,  { cache: "no-store" }).then(r => r.json()).catch(() => null) : null
      ]);
      if (rCnt && !rCnt.error) for (const k of ORDER) if (rCnt[k] != null) legState[k].entered = rCnt[k];
      if (rWav && !rWav.error) for (const k of ORDER) {
        if (!Array.isArray(rWav[k])) continue;
        const parsed = rWav[k]
          .map(w => ({ ms: waveMs(w.t), n: Number(w.n) || 0 }))
          .filter(w => w.ms != null && w.n > 0)
          .sort((a, b) => a.ms - b.ms);
        legState[k].waves = parsed.length ? parsed : null;
      }
      if (rRes && !rRes.error) {
        if (raceStart == null && rRes.raceStart) raceStart = new Date(rRes.raceStart).getTime();
        const legs = rRes.legs || {};
        const ret = rRes.retired || {};
        for (const key of ORDER) {
          if (ret[key] != null) legState[key].ret = ret[key];
          const arr = legs[key] || [];
          legState[key].done = arr.length;
          // backend already returns each course sorted by finish time
          legState[key].top = arr.slice(0, 10).map(r => ({ team: r.team, time: r.time }));
          renderTop(key);
          arr.forEach((r, i) => { if (i >= (legState[key]._shown || 0)) addFeed({ legKey: key, team: r.team, place: r.place, time: r.time, ts: Date.now() }); });
          legState[key]._shown = arr.length;
        }
      }
      const hadResults = rRes && !rRes.error;
      set("oc-livetxt", !CONFIG.RESULTS_URL ? "Standing by"
        : (raceStart && Date.now() < raceStart) ? "Pre-start"
        : hadResults ? "System Live" : "Awaiting results");
      paint();
    } catch (e) { set("oc-livetxt", "Awaiting results…"); paint(); }
  }

  // Live: poll the static JSON the GitHub Action publishes, then refresh.
  poll();
  setInterval(poll, Math.max(10, CONFIG.REFRESH_SECONDS) * 1000);
})();
</script>
