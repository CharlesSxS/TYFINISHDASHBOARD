# ============================================================
# TOKYO YAMATHON 2026 — FINISH LINE DASHBOARD  ·  data refresh
# (c) 2026 SxS Partners. All rights reserved.
#
# Pulls Webscorer data and commits data/counts.json + data/results.json.
# Committing to main triggers the GitHub Pages rebuild, so the live
# dashboard updates automatically.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   WEBSCORER_APIID   your JSON API ID  (digits at the end of the organizer
#                     page URL — not a race id, not the token)
#   WEBSCORER_TOKEN   your JSON API token (RESET it first; keep it only here)
#
# Cadence: every 10 minutes (6 Pages builds/hour, under the 10/hr soft limit).
# For race day you may switch to '*/5 * * * *' for faster finishers; after the
# event, reduce to '*/30' or disable this workflow to save Actions minutes.
# ============================================================
name: Yamathon data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: yamathon-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Webscorer data
        env:
          WEBSCORER_APIID: ${{ secrets.WEBSCORER_APIID }}
          WEBSCORER_TOKEN: ${{ secrets.WEBSCORER_TOKEN }}
        run: node scripts/fetch.mjs

      - name: Commit updated data
        run: |
          git config user.name  "yamathon-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/counts.json data/results.json data/waves.json
          if git diff --quiet --staged; then
            echo "No data change."
          else
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git push
          fi
